<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="graph-wrapper">
        <h1>Ocorrências de congestionamento prolongado</h1>
        <div class="graph">
            <canvas id="myChart" style="height: 60vh; width: 60vw;"></canvas>
        </div>
    </div>



</body>

<script>
    const ctx = document.getElementById('myChart');

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: [
                'Segunda', 
                'Terça', 
                'Quarta', 
                'Quinta', 
                'Sexta', 
                'Sábado', 
                'Domingo'
            ],

            datasets: [{
                label: 'Setor de Limpeza',
                backgroundColor: 'rgb(138, 43, 226)',
                borderColor: 'rgb(138, 43, 226)',
                data: [2, 1, 4, 3, 6, 7, 9],
                borderWidth: 1
            },
            {
                label: 'Setor Alimentício',
                backgroundColor: 'rgb(15, 28, 38)',
                borderColor: 'rgb(15, 28, 38)',
                data: [7, 8, 5, 1, 5, 9, 10],
                borderWidth: 1
            },
            {
                label: 'Setor de Bebidas',
                backgroundColor: 'rgb(255, 123, 0',
                borderColor: 'rgb(255, 123, 0)',
                data: [6, 3, 4, 8, 10, 11, 9],
                borderWidth: 1
            },
        ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</html>

<!DOCTYPE html>
<html lang="pt_br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap"
        rel="stylesheet">
    <title>Atividade: Chart.js</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="graph-wrapper">
        <h1>Ocorrências de congestionamento prolongado (Treino para meu projeto de P.I)</h1>
        <div class="graph-fluxlog">
            <canvas id="myChart"></canvas>
        </div>
    </div>

    <div class="graph-wrapper-task">
        <h1>Atividade: Chart.js</h1>
        <div class="graphs-wrapper">
            <div class="graph">
                <canvas id="myChart2"></canvas>
            </div>

            <div class="graph">
                <canvas id="myChart3"></canvas>
            </div>
        </div>
    </div>



</body>

<script>
    const fluxlog = document.getElementById('myChart');
    const task1 = document.getElementById('myChart2');
    const task2 = document.getElementById('myChart3');


    new Chart(fluxlog, {
        type: 'line',

        data: {
            labels: [
                'Segunda',
                'Terça',
                'Quarta',
                'Quinta',
                'Sexta',
                'Sábado',
                'Domingo'
            ],

            datasets: [{
                label: 'Setor de Limpeza',
                backgroundColor: 'rgb(138, 43, 226)',
                borderColor: 'rgb(138, 43, 226)',
                data: [2, 1, 4, 3, 6, 7, 9],
                borderWidth: 1
            },
            {
                label: 'Setor Alimentício',
                backgroundColor: 'rgb(15, 28, 38)',
                borderColor: 'rgb(15, 28, 38)',
                data: [7, 8, 5, 1, 5, 9, 10],
                borderWidth: 1
            },
            {
                label: 'Setor de Bebidas',
                backgroundColor: 'rgb(255, 123, 0',
                borderColor: 'rgb(255, 123, 0)',
                data: [6, 3, 4, 8, 10, 11, 9],
                borderWidth: 1
            },
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(task1, {
        type: 'line',

        data: {
            labels: [
                '12:00',
                '13:00',
                '14:00',
                '15:00',
                '16:00',
                '17:00',
            ],

            datasets: [{
                label: 'Temperatura',
                backgroundColor: 'rgb(255, 98, 129)',
                borderColor: 'rgb(255, 98, 129)',
                data: [30, 29, 28, 25, 22, 23],
                borderWidth: 1
            },
            {
                label: 'Umidade',
                backgroundColor: 'rgb(60, 160, 230)',
                borderColor: 'rgb(60, 160, 230)',
                data: [80, 82, 80, 85, 80, 83],
                borderWidth: 1
            },
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });

    new Chart(task2, {
        type: 'bar',

        data: {
            labels: [
                'Janeiro',
                'Fevereiro',
                'Março',
                'Abril',
                'Maio',
                'Junho',
            ],

            datasets: [{
                label: 'Temperatura Média',
                backgroundColor: 'rgb(255, 98, 129)',
                borderColor: 'rgb(255, 98, 129)',
                data: [22, 24, 27, 23, 20, 18],
                borderWidth: 1
            },
            {
                label: 'Umidade Média',
                backgroundColor: 'rgb(60, 160, 230)',
                borderColor: 'rgb(60, 160, 230)',
                data: [90, 89, 93, 87, 88, 82],
                borderWidth: 1
            },
            ]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>

</html>
